<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鲸鱼捏捏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #FCFEFF 0%, #EEF5FC 58%, #DDE9F6 100%);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(84vmin, 600px);
    height: min(84vmin, 600px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(150, 195, 248, 0.20) 0%, rgba(150, 195, 248, 0) 66%);
    pointer-events: none;
  }

  /* 贴地阴影:不参与形变,只跟着被压扁/拉长 */
  #shadowWrap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(80vmin, 570px);
    height: min(80vmin, 570px);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #shadowWrap svg { display: block; width: 100%; height: 100%; }

  #stage {
    position: relative;
    width: min(80vmin, 570px);
    height: min(80vmin, 570px);
    filter: drop-shadow(0 1.4vmin 2.2vmin rgba(120, 160, 215, 0.18));
    cursor: grab;
  }
  #stage.grabbing { cursor: grabbing; }
  #stage svg { display: block; width: 100%; height: 100%; overflow: visible; }

  #hint {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    font-size: clamp(13px, 2.4vmin, 16px);
    letter-spacing: 0.14em;
    color: #93AECB;
    white-space: nowrap;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }
  #hint.hide { opacity: 0; }

  #reset {
    position: absolute;
    right: 4%;
    top: 4%;
    padding: 0.7em 1.15em;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 2px 10px rgba(120, 160, 215, 0.18);
    color: #6E93BC;
    font-size: clamp(12px, 2.2vmin, 14px);
    font-family: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }
  #reset:hover { box-shadow: 0 4px 14px rgba(120, 160, 215, 0.26); }
  #reset:active { transform: scale(0.94); }
</style>
</head>

<script>
/* =====================================================================
 * 小鲸鱼捏捏(水彩风)
 *
 * 交互:
 *   1) 长按/按住   -> 压扁:纵向压缩、横向铺开
 *   2) 按住拖动    -> 形变跟着手指方向走,横向也能被压
 *   3) 松手        -> 弹簧回弹,带轻微过冲
 *   4) 捏得狠时    -> 头顶溅出小水珠
 *
 * 形变靠 SVG transform 做非等比缩放;每帧的缩放值由弹簧积分算出来,
 * 所以回弹与过冲是"物理"出来的,改 STIFF / DAMP 就能换手感。
 * ===================================================================== */
(function () {
  'use strict';

  // 身体中心:缩放围绕它做
  var CX = 200, CY = 272;

  var MAX_STRETCH = 0.40;   // 横向最多铺开多少
  var MAX_FLATTEN = 0.42;   // 纵向最多压扁多少
  var MAX_SIDE    = 0.28;   // 横向被压的上限
  var FULL_PRESS_PX = 130;  // 拖多少像素算"捏满"

  var STIFF = 200;          // 弹簧硬度
  var DAMP  = 16;           // 阻尼(调小则抖动更久)


  var stage      = document.getElementById('stage');
  var squish     = document.getElementById('squish');
  var creases    = document.getElementById('creases');
  var shadow     = document.getElementById('shadow');
  var shadowWrap = document.getElementById('shadowWrap');
  var spoutFix   = document.getElementById('spoutFix');
  var spoutBob   = document.getElementById('spoutBob');
  var spoutDrops = document.getElementById('spoutDrops');
  var hint       = document.getElementById('hint');
  var resetBtn   = document.getElementById('reset');

  var target = { tx: 0, ty: 0 };
  var pos    = { tx: 0, ty: 0, vx: 0, vy: 0 };

  var pressing = false, pressStartX = 0, pressStartY = 0;
  // 水花:锚点是喷水孔;几何用"相对喷水孔"的偏移,与 SVG 里的坐标系一致
  var SPOUT_X = 122, SPOUT_Y = 194;   // 与水花 SVG 里的喷水孔坐标一致
  // 水珠:固定散点(大小不一、疏密不均),而不是等距一圈 —— 那样太"机械"
  var DROPS = [
    { x: -35, y: -34, r: 5.4, ph: 0.0 },
    { x: -25, y: -56, r: 4.4, ph: 1.1 },
    { x: -6, y: -70, r: 5.8, ph: 2.2 },
    { x: 16, y: -75, r: 4.8, ph: 3.0 },
    { x: 36, y: -62, r: 5.6, ph: 4.1 },
    { x: 47, y: -36, r: 4.2, ph: 5.0 },
    { x: 40, y: -22, r: 3.6, ph: 5.8 }
  ];
  var time = 0, interacted = false, hidden = false;
  var sxCur = 1, syCur = 1;

  document.addEventListener('visibilitychange', function () { hidden = document.hidden; });
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ------------------------------------------------ 常驻水花 */

  // 水珠:固定散点,各自原地轻微起伏,大小不一
  function drawSpout(squeeze) {
    var out = [];
    for (var i = 0; i < DROPS.length; i++) {
      var d = DROPS[i];
      // 被捏时整簇稍微收拢
      var k = 1 - squeeze * 0.15;
      var x = d.x * k;
      var y = d.y * k + Math.sin(time * 1.5 + d.ph) * 2.4;
      var r = d.r * (1 - squeeze * 0.08);

      out.push(
        '<path d="M' + x.toFixed(1) + ',' + (y - r * 1.5).toFixed(1) +
        ' C' + (x + r * 0.92).toFixed(1) + ',' + (y - r * 0.3).toFixed(1) +
        ' ' + (x + r).toFixed(1) + ',' + (y + r * 0.45).toFixed(1) +
        ' ' + x.toFixed(1) + ',' + (y + r).toFixed(1) +
        ' C' + (x - r).toFixed(1) + ',' + (y + r * 0.45).toFixed(1) +
        ' ' + (x - r * 0.92).toFixed(1) + ',' + (y - r * 0.3).toFixed(1) +
        ' ' + x.toFixed(1) + ',' + (y - r * 1.5).toFixed(1) + ' Z" ' +
        'fill="#A8CBEE" stroke="#17427A" stroke-width="2.4" ' +
        'stroke-linejoin="round"/>');
    }
    spoutDrops.innerHTML = out.join('');
  }

  /* ------------------------------------------------------------ 指针 */

  function pointFromEvent(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function pressStart(e) {
    pressing = true;
    stage.classList.add('grabbing');
    var p = pointFromEvent(e);
    pressStartX = p.x; pressStartY = p.y;
    if (!interacted) { interacted = true; hint.classList.add('hide'); }
    if (e.cancelable) e.preventDefault();
  }

  function pressMove(e) {
    if (!pressing) return;
    var p = pointFromEvent(e);
    var dx = p.x - pressStartX, dy = p.y - pressStartY;

    var down = clamp(dy / FULL_PRESS_PX, 0, 1);
    var up   = clamp(-dy / (FULL_PRESS_PX * 1.8), 0, 1);
    var side = clamp(Math.abs(dx) / (FULL_PRESS_PX * 1.25), 0, 1);

    target.ty = clamp(-down * MAX_FLATTEN + up * 0.16, -MAX_FLATTEN, 0.2);
    target.tx = clamp(down * MAX_STRETCH + side * MAX_SIDE - up * 0.1, -0.12, MAX_STRETCH + MAX_SIDE);

    if (e.cancelable) e.preventDefault();
  }

  function pressEnd() {
    if (!pressing) return;
    pressing = false;
    stage.classList.remove('grabbing');
    target.tx = 0; target.ty = 0;
  }

  stage.addEventListener('mousedown', pressStart);
  window.addEventListener('mousemove', pressMove);
  window.addEventListener('mouseup', pressEnd);
  stage.addEventListener('touchstart', pressStart, { passive: false });
  window.addEventListener('touchmove', pressMove, { passive: false });
  window.addEventListener('touchend', pressEnd);
  window.addEventListener('touchcancel', pressEnd);
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  resetBtn.addEventListener('click', function () {
    target.tx = 0; target.ty = 0;
    pos.tx = pos.ty = pos.vx = pos.vy = 0;
  });

  /* ------------------------------------------------------------ 主循环 */

  var last = 0;

  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (hidden || dt > 0.05) dt = 1 / 60;   // 切回前台时钳住,免得瞬移

    time += dt;

    /* 弹簧 */
    var ax = -STIFF * (pos.tx - target.tx) - DAMP * pos.vx;
    var ay = -STIFF * (pos.ty - target.ty) - DAMP * pos.vy;
    pos.vx += ax * dt; pos.vy += ay * dt;
    pos.tx += pos.vx * dt; pos.ty += pos.vy * dt;

    /* 待机:极轻微呼吸 */
    var idle = pressing ? 0 : Math.sin(time * 1.5) * 0.011;
    var sx = 1 + pos.tx + idle * 0.5;
    var sy = 1 + pos.ty - idle * 0.5;

    /* 体积感 */
    sy -= pos.tx * 0.22;
    sx -= pos.ty * 0.22;
    sx = clamp(sx, 0.6, 1.9);
    sy = clamp(sy, 0.42, 1.4);

    sxCur = sx; syCur = sy;
    squish.setAttribute('transform',
      'translate(' + CX + ',' + CY + ') scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) +
      ') translate(' + (-CX) + ',' + (-CY) + ')');

    var squeeze = clamp(-pos.ty / MAX_FLATTEN, 0, 1);

    /* 褶皱 */
    creases.setAttribute('opacity', (squeeze * 0.8).toFixed(3));

    /* 阴影 */
    var shx = 1 + pos.tx * 0.9;
    var shy = 1 - clamp(-pos.ty, 0, 1) * 0.25;
    shadow.setAttribute('transform',
      'translate(176,340) scale(' + shx.toFixed(3) + ',' + shy.toFixed(3) + ') translate(-176,-340)');
    shadow.setAttribute('opacity', (0.85 + squeeze * 0.15).toFixed(3));
    shadowWrap.style.filter = 'blur(' + (1.1 + squeeze * 1.5).toFixed(2) + 'px)';

    /* ---- 水花:锚定到喷水孔 + 纵向补偿 ----
       水花几何画在原点,先 translate 到喷水孔(局部坐标 122,194)——
       与喷水孔在同一个坐标系里,所以捏扁时天然零错位。
       纵向若跟着 sy 一起压,水花会被压成一条线,故子组乘 1/sy 抵消。 */
    var bob = Math.sin(time * 1.8) * 1.8;
    spoutFix.setAttribute('transform',
      'translate(' + SPOUT_X + ',' + SPOUT_Y + ') scale(1,' + (1 / syCur).toFixed(4) + ')');
    spoutBob.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');
    drawSpout(squeeze);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
